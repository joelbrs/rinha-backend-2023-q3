spring:
  application:
    name: rinha-backend-2023-q3
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rinha_db}
    username: ${DB_USERNAME:rinha}
    password: ${DB_PASSWORD:rinha}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 80
      minimum-idle: 0
      connection-timeout: 60000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: ${PORT:8080}
  connection-timeout: 60000